[pytest]
# Plugin tests live next to the plugin (plugins/<name>/tests/), so writing a
# plugin never means editing backend/tests/. See docs/PLUGIN-AUTHORING.md.
#
# importlib mode is required, not cosmetic: two plugins that both ship a
# `tests/test_crud.py` would otherwise collide as the same module name.
addopts = --import-mode=importlib
testpaths = tests ../plugins